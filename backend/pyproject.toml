[project]
name = "dogmeat-backend"
version = "0.1.0"
description = "Telegram Mini App: магазин мяса для собак — API и бот"
readme = "README.md"
# Целевая версия — 3.11+ (в Docker используется 3.12).
# Нижняя граница снижена до 3.10, чтобы проект собирался и на машинах разработчиков с 3.10.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.31",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = []
