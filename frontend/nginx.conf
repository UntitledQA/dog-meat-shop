# Конфигурация nginx для SPA «Мясо для собак».
# Копируется в /etc/nginx/conf.d/app.conf, поэтому это server-блок,
# а не полный nginx.conf с директивами уровня main/http.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Загрузка фотографий товаров: MAX_UPLOAD_SIZE_MB по умолчанию 5, берём с запасом,
    # чтобы превышение лимита обрабатывал backend своим кодом ошибки file_too_large,
    # а не nginx безликой HTML-страницей 413.
    client_max_body_size 10m;
    client_body_timeout 120s;

    # Telegram открывает Mini App во фрейме своего WebView, поэтому
    # X-Frame-Options / frame-ancestors намеренно НЕ выставляем.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------ gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------------------- проверка живости
    # Используется healthcheck'ом контейнера frontend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --------------------------------------------------------------- API-прокси
    # location с завершающим слэшем + proxy_pass без пути => исходный URI уходит
    # на backend без изменений: /api/v1/catalog -> http://backend:8000/api/v1/catalog
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSocket в API не используется — держим keep-alive до upstream.
        proxy_set_header Connection        "";

        # Загрузка файлов идёт потоком: backend проверяет размер до записи на диск.
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Ответы API не кэшируем ни на одном промежуточном узле.
        add_header Cache-Control "no-store" always;
    }

    # Health-check backend доступен снаружи как /health (он без префикса /api/v1).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ------------------------------------------------- фотографии товаров
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # Имя файла — secrets.token_hex(16), содержимое неизменно: кэшируем надолго.
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --------------------------------------------------------- статика сборки
    # Vite кладёт файлы с хэшем в имени в /assets — кэшируем навсегда.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя пользователь останется на старой
    # сборке и получит 404 на новые файлы из /assets.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ------------------------------------------------------- SPA-роутинг
    # Любой неизвестный путь (/cart, /admin/orders/12, ...) отдаёт index.html,
    # дальше маршрут разбирает react-router на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
